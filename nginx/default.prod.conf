# Production nginx config with TLS termination. Not used by
# docker-compose.yml (local dev) — mounted in by docker-compose.prod.yml
# instead, alongside the SSL_CERT_PATH / SSL_KEY_PATH volume mounts.
# No domain is hardcoded: nginx just serves whatever cert/key are mounted at
# the fixed container paths below.

server {
    listen 80 default_server; #ip4
    listen [::]:80 default_server; #ip6

    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    index index.html;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /api/ {
        proxy_pass http://backend:8000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
